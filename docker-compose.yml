version: '3.8'

services:
  alpha-tracker:
    build: .
    restart: unless-stopped
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-alpha_user}
      - DB_PASSWORD=${DB_PASSWORD:-alpha_password}
      - DB_NAME=${DB_NAME:-alpha_db}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-alpha_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alpha_password}
      POSTGRES_DB: ${DB_NAME:-alpha_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alpha_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
