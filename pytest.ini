[pytest]
# Only tests/ holds real tests.
#
# scripts/ contains ad-hoc probes that were historically named test_*.py at the
# repo root. pytest collected them by default, and some make network calls at
# IMPORT time — a bare `pytest` took 5m37s and picked up a stray
# test_conviction() from scripts/test_alpha_engine_score.py. Pinning testpaths
# means `pytest` and `pytest tests/` now collect exactly the same 144 tests.
testpaths = tests

# Ignore anything that could be collected from the probe or research dirs even
# if someone runs pytest with an explicit path.
norecursedirs = scripts .venv data __pycache__ .git

# Quieter default output; -q still works on top of this.
addopts = --strict-markers
