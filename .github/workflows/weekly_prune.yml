name: Weekly Graph Prune

on:
  schedule:
    # Sunday 11:30 AM IST (06:00 UTC)
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly prune
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python refresh.py --mode prune

      - name: Commit pruned graph
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/graph.json data/cache.sqlite || true
          git diff --staged --quiet || git commit -m "chore: weekly graph prune $(date +%Y-%m-%d)"
          git push || true
