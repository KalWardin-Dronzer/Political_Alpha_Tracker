name: Quarterly Watchlist Refresh

on:
  schedule:
    # 1st of Jan, Apr, Jul, Oct at 9:30 AM IST (04:00 UTC)
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  quarterly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quarterly refresh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python refresh.py --mode quarterly

      - name: Commit refreshed data
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore: quarterly watchlist refresh $(date +%Y-%m-%d)"
          git push || true
