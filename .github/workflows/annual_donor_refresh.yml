name: Annual Donor Data Refresh

on:
  # SCHEDULE DISABLED ON PURPOSE — see .github/workflows/README.md
  #
  # This job ran `refresh.py` on a GitHub runner, whose checkout has no
  # database (data/cache.sqlite is gitignored). It therefore refreshed
  # reference data into an empty, throwaway SQLite file. The commit step below
  # was meant to persist it, but `git add` on a gitignored path stages nothing,
  # so nothing was ever pushed. The job has never had any effect on real data,
  # while sending a Telegram summary that looked like it had.
  #
  # Reference-data refreshes must run where the data lives, on EC2:
  #   docker run --rm --env-file /home/ubuntu/Insider-trading/.env   #     -v /home/ubuntu/Insider-trading/data:/app/data   #     alpha-tracker python refresh.py --mode MODE
  #
  # Manual dispatch is kept for debugging.
  # schedule:
  # # March 15 at 9:30 AM IST (04:00 UTC) — after ADR typically publishes
  # - cron: '0 4 15 3 *'

  workflow_dispatch:

jobs:
  annual:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # tabula-py requires Java
          sudo apt-get update && sudo apt-get install -y default-jre-headless

      - name: Run annual donor refresh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python refresh.py --mode annual

      - name: Commit refreshed data
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore: annual donor data refresh $(date +%Y-%m-%d)"
          git push || true
